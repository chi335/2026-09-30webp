<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카푸치노 만들기</title>
    <style>
        /* <ol> 태그의 기본 마커 제거 및 상자 스타일 지정 */
        ol {
            list-style-type: none;     /* 문제 조건: 마커 제거 */
            padding: 20px;
            background-color: #f8f1e5; /* 따뜻한 베이지색 배경 */
            border: 1px solid #d3d3d3; /* 외곽 테두리 */
            width: 380px;
        }

        /* 상단 제목 */
        .caption {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 각 리스트 항목 (li) */
        li {
            display: flex;             /* 숫자와 텍스트를 나란히 배치 */
            align-items: flex-start;   /* 위쪽 정렬 */
            margin-bottom: 15px;
        }

        /* <span> 큰 숫자 마커 스타일 */
        .num {
            font-size: 32px;           /* 숫자 크게 키우기 */
            font-weight: bold;
            color: green;              /* 초록색 지정 */
            margin-right: 12px;
            line-height: 1;
        }

        /* <p> 설명 텍스트 스타일 */
        li p {
            margin: 0;                 /* p 태그 기본 여백 제거 */
            font-size: 14px;
            line-height: 1.4;          /* 줄간격 설정 */
        }
    </style>
</head>
<body>

    <h3>카푸치노</h3>
    <hr>

    <ol>
        <div class="caption">카푸치노 만드는 순서</div>
        <li>
            <span class="num">1.</span>
            <p>에스프레소를 추출한다. 반드시 에스프레소 콩을 사용해야 제맛이 난다.</p>
        </li>
        <li>
            <span class="num">2.</span>
            <p>적당한 용기에 우유를 넣어 중탕을 하거나 끓기 직전까지 데운다.</p>
        </li>
        <li>
            <span class="num">3.</span>
            <p>몇초간 저어 충분히 거품을 낸다. 거품이 충분하지 않으면 풍미가 떨어진다.</p>
        </li>
        <li>
            <span class="num">4.</span>
            <p>컵에 계피 막대를 꽂고 커피를 부은후 우유 거품을 붓는다. 휘핑 크림을 얹고 계피가루를 뿌린다.</p>
        </li>
    </ol>

</body>
</html>
