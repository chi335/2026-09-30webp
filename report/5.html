<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리스트 만들기</title>
    <style>
        /* 리스트 박스 전체 스타일 */
        ul {
            background-color: aliceblue; /* aliceblue 배경색 */
            list-style-type: square;    /* 사각형 마커 */
            width: 200px;               /* 영역 폭 */
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 30px;
            padding-right: 10px;        /* 문제 조건: padding-right: 10px */
        }

        /* 마우스가 리스트 아이템 위에 올라갔을 때(hover) */
        li:hover {
            background-color: yellowgreen; /* yellowgreen 색상으로 변경 */
        }
    </style>
</head>
<body>

    <h3>가보고 싶은 나라</h3>
    <hr>

    <ul>
        <li>프랑스</li>
        <li>독일</li>
        <li>칠레</li>
        <li>남아프리카공화국</li>
    </ul>

</body>
</html>
