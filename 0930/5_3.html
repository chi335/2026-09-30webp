<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>절대배치</title>
    <style>
        /* 트리를 감싸는 부모 div (기준점 설정) */
        div.tree-box {
            position: relative; /* 자식 요소의 absolute 기준이 됨 */
            display: inline-block;
            border: 1px solid lightgray;
            width: 200px;
            height: 200px;
        }

        /* div의 자식 이미지 */
        div.tree-box img {
            width: 100%;
            height: 100%;
        }

        /* div의 자식 p태그 (글자 박스) */
        div.tree-box > p.letter {
            position: absolute;
            height: 20px;
            width: 15px;
            background: lightgray;
            text-align: center;
            line-height: 20px; /* 글자를 수직 가운데 정렬 */
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h3>Merry Christmas!</h3>
    <hr>
    <p>예수님이 탄생하셨습니다.</p>
    
    <div class="tree-box">
        <img src="media/christmastree.png" alt="크리스마스트리">
        <p class="letter" style="left: 50px; top: 30px;">M</p>
        <p class="letter" style="left: 100px; top: 0px;">E</p>
        <p class="letter" style="left: 100px; top: 80px;">R</p>
        <p class="letter" style="left: 150px; top: 110px;">R</p>
        <p class="letter" style="left: 30px; top: 130px;">Y</p>
    </div>
</body>

</html>
