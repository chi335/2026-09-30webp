<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>transition</title>
    <style>
        img {
            width: 100px;             /* 초기 이미지 폭 */
            transition: width 2s;     /* 폭(width) 변경 시 2초 동안 부드럽게 전환 */
        }

        /* 마우스를 올렸을 때 (:hover) */
        img:hover {
            width: 100%;              /* 브라우저 폭의 100% 크기로 확장 */
        }
    </style>
</head>
<body>

    <h3>마우스를 올려봐요</h3>
    <hr>

    <img src="spongebob.png" alt="스폰지밥">

</body>
</html>
