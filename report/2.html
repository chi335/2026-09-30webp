<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>position: fixed 실습</title>
    <style>
        /* 하단 고정 광고문 스타일 */
        .fixed-banner {
            position: fixed;      /* 브라우저 화면 기준으로 위치 고정 */
            bottom: 0;            /* 바닥에 밀착 */
            left: 0;              /* 왼쪽 끝에 밀착 */
            width: 100%;          /* 브라우저 폭 전체(100%) 크기 */
            background-color: violet; /* 보라색 배경 */
            color: blue;          /* 파란색 글자 */
            font-weight: bold;    /* 글자 두껍게 */
            padding: 10px;        /* 안쪽 여백 부여 */
            text-align: left;     /* 글자 왼쪽 정렬 */
            box-sizing: border-box; /* 패딩이 추가되어도 폭 100%가 깨지지 않도록 설정 */
        }
    </style>
</head>
<body>

    <h3>소연재</h3>
    <hr>
    <p>
        저는 체조 선수 소연재입니다. 음악을 들으면서 책읽기를 좋아합니다. 김치 찌개와 막국수 무척 좋아합니다.
    </p>

    <!-- 화면 바닥에 항상 나타나는 광고문 -->
    <div class="fixed-banner">
        소연재공연은 24일입니다
    </div>

</body>
</html>
